# 暫時給人看畫面用：推到 github-pages 分支就自動烤成靜態站、發布到 GitHub Pages
# 網址 https://katyaerixc.github.io/asg-frontend/
# 正式部署仍是 Dockerfile（node-cluster SSR），這支只是預覽用，不影響公司 GitLab 的流程
name: Deploy to GitHub Pages

on:
  push:
    branches: [github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /asg-frontend/
          NUXT_SITE_URL: https://katyaerixc.github.io
          NUXT_PUBLIC_I18N_BASE_URL: https://katyaerixc.github.io
          # 預覽站不給搜尋引擎收錄；沒設就是 false
          SEO_INDEXING_ENABLED: 'false'
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
